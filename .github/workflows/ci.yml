name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # TypeScript 7 needs legacy peer resolution here, matching .npmrc.
      - run: npm ci --legacy-peer-deps

      # Runs graphql-codegen first, and this job is what actually ENFORCES the SOURCE_METHODS / FRAME_METHODS
      # exhaustiveness guards and the SOURCE_REPLAY classification: they are compile-time only and fail nowhere else.
      - run: npm run type-check

      - run: npm test

      - run: npm run lint

      # Kept because it includes the separate frame bundle, which has no HMR and is easy to leave stale after a src/frame change.
      - run: npm run build
